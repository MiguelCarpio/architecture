# yamllint disable rule:line-length
# local-config: referenced, but not emitted by kustomize
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edpm-nodeset-values
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  # BMO-provisioned host: root password (base64) for the provisioned node.
  root_password: cmVkaGF0Cg==  # base64 (echo -n 'password' | base64)
  preProvisioned: "false"

  # Final nmstate networkData applied to the EDPM node after provisioning.
  baremetalHostsNetworkData:
    edpm-compute-0:
      networkData: |
        CHANGEME

  baremetalSetTemplate:
    # the physical NIC that carries the ctlplane VLAN. Verify OS name post-boot: ip -o link
    ctlplaneInterface: eno16905np1  # CHANGEME
    cloudUserName: cloud-admin
    bmhNamespace: openstack
    # Technology Preview: provision RHEL 9.6 directly via BMO instead of the default
    # bundled RHEL 9.4 image. OpenStackBaremetalSet auto-creates the OpenStackProvisionServer.
    osImage: edpm-hardened-uefi-9.6.qcow2
    osContainerImageUrl: registry.redhat.io/rhoso/edpm-hardened-uefi-rhel9:18.0.18
    automatedCleaningMode: disabled
    # must match all or a subset of the labels in baremetalhosts/values.yaml
    bmhLabelSelector:
      app: openstack  # CHANGEME
    passwordSecret:
      name: baremetalset-password-secret
      namespace: openstack

  ssh_keys:
    # base64-encoded (base64 -w0 < ~/.ssh/id_rsa_edpm)
    authorized: CHANGEME
    # base64-encoded private key for Ansible access
    private: CHANGEME2
    # base64-encoded public key
    public: CHANGEME3

  nodeset:
    ansible:
      ansibleUser: cloud-admin
      ansiblePort: 22
      ansibleVars:
        # OCP-managed DNS domain (must match NetConfig dnsDomain), not the real OS hostname domain.
        fqdn_internal_api: edpm-compute-0.internalapi.rtx-pro-6000-gpu-passthrough.test  # CHANGEME

        # CHANGEME credentials - see https://access.redhat.com/solutions/253273
        # edpm_bootstrap_command: |
        #   subscription-manager register --username <subscription_manager_username> \
        #     --password <subscription_manager_password>
        #   subscription-manager release --set=9.6
        #   subscription-manager repos --disable=*
        #   subscription-manager repos \
        #     --enable=rhel-9-for-x86_64-baseos-eus-rpms \
        #     --enable=rhel-9-for-x86_64-appstream-eus-rpms \
        #     --enable=rhel-9-for-x86_64-highavailability-eus-rpms \
        #     --enable=fast-datapath-for-rhel-9-x86_64-rpms \
        #     --enable=rhoso-18.0-for-rhel-9-x86_64-rpms \
        #     --enable=rhceph-7-tools-for-rhel-9-x86_64-rpms
        edpm_bootstrap_release_version_package: []

        timesync_ntp_servers:
          - hostname: pool.ntp.org

        # GPU passthrough kernel args for NVIDIA RTX PRO 6000 (10de:2bb5):
        #   intel_iommu=on iommu=pt  — enable IOMMU in passthrough mode (Intel host)
        #   vfio-pci.ids=10de:2bb5   — claim the GPU with vfio-pci at boot
        #                              (verify with: lspci -nn | grep -i nvidia)
        #   rd.driver.pre=vfio-pci   — load vfio-pci early so it binds the GPU before nvidia
        # CHANGEME - adjust hugepages for your host memory and workload.
        edpm_kernel_args: "default_hugepagesz=1GB hugepagesz=1G hugepages=64 intel_iommu=on iommu=pt vfio-pci.ids=10de:2bb5 rd.driver.pre=vfio-pci"

        edpm_tuned_profile: cpu-partitioning-powersave
        # CHANGEME — adjust for your CPU topology.
        # Full-device passthrough does not require CPU pinning.
        # edpm_tuned_isolated_cores: "4-23,28-47"

        # RTX PRO 6000 host takes longer to POST and boot; increase if SSH is not ready in time.
        edpm_reboot_strategy: auto
        edpm_reboot_timeout_reboot: 1200
        edpm_reboot_post_reboot_delay: 360

        edpm_ovn_bridge_mappings:
          - datacentre:br-ex
          - internet:br-internet

        # Map logical NIC names (nic1, nic2) to physical MAC addresses.
        # Run `ip -o link` on the EDPM host to find the correct MACs.
        edpm_network_config_os_net_config_mappings:
          edpm-compute-0:
            nic1: 00:00:00:00:00:01  # CHANGEME — external access NIC MAC
            nic2: 00:00:00:00:00:02  # CHANGEME — trunk NIC MAC (VLANs: ctlplane, internalapi, storage, tenant)

        # Two OVS bridges:
        #   br-internet (nic1) — external access network, direct IP.
        #   br-ex (nic2) — trunk: ctlplane VLAN + isolated OpenStack VLANs.
        # CHANGEME - adjust IP, CIDR, gateway, VLAN IDs, and domain to match your environment.
        edpm_network_config_template: |
          ---
          {% set mtu_list = [ctlplane_mtu] %}
          {% for network in nodeset_networks %}
          {% set _ = mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) %}
          {%- endfor %}
          {% set min_viable_mtu = mtu_list | max %}
          network_config:
          - type: ovs_bridge
            name: {{ neutron_public_interface_name }}
            mtu: {{ min_viable_mtu }}
            use_dhcp: false
            addresses:
            - ip_netmask: 192.168.0.100/24  # CHANGEME — external IP/CIDR
            routes:
              - ip_netmask: 0.0.0.0/0
                default: True
                next_hop: 192.168.0.1  # CHANGEME — gateway for external access network
            members:
            - type: interface
              name: nic1
              mtu: {{ min_viable_mtu }}
              primary: true
          - type: ovs_bridge
            name: {{ neutron_physical_bridge_name }}
            mtu: {{ min_viable_mtu }}
            use_dhcp: false
            members:
            - type: interface
              name: nic2
              mtu: {{ min_viable_mtu }}
              primary: true
            - type: vlan
              mtu: {{ min_viable_mtu }}
              vlan_id: 10  # CHANGEME — ctlplane VLAN ID
              addresses:
              - ip_netmask: {{ ctlplane_ip }}/{{ ctlplane_cidr }}
              dns_servers: {{ ctlplane_dns_nameservers }}
              domain: {{ dns_search_domains }}
              routes: {{ ctlplane_host_routes }}
          {% for network in nodeset_networks %}
            - type: vlan
              mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
              vlan_id: {{ lookup('vars', networks_lower[network] ~ '_vlan_id') }}
              addresses:
              - ip_netmask:
                  {{ lookup('vars', networks_lower[network] ~ '_ip') }}/{{ lookup('vars', networks_lower[network] ~ '_cidr') }}
              routes: {{ lookup('vars', networks_lower[network] ~ '_host_routes') }}
          {% endfor %}

        neutron_physical_bridge_name: br-ex
        neutron_public_interface_name: br-internet
        edpm_nodes_validation_validate_controllers_icmp: false
        edpm_nodes_validation_validate_gateway_icmp: false
        edpm_sshd_configure_firewall: true
        edpm_network_config_update: true
        edpm_network_config_nmstate: true
        edpm_sshd_allowed_ranges:
          - 192.168.122.0/24  # CHANGEME
        gather_facts: false

    networks:
      - defaultRoute: false
        name: ctlplane
        subnetName: subnet1
      - name: internalapi
        subnetName: subnet1
      - name: storage
        subnetName: subnet1
      - name: tenant
        subnetName: subnet1

    nodes:
      edpm-compute-0:
        ansible:
          ansibleHost: 192.168.0.100  # CHANGEME
        # Real OS hostname — must match `hostname -f` on the node. Becomes the host=<hostname> in nova.conf.
        hostName: edpm-compute-0.example.com  # CHANGEME
        # BMH label selector — must match a BareMetalHost in baremetalhosts/values.yaml.
        bmhLabelSelector:
          nodeName: edpm-compute-0
        networkData:
          name: edpm-compute-0-network-data
          namespace: openstack
        networks:
          - defaultRoute: false
            name: ctlplane
            subnetName: subnet1
            fixedIP: 192.168.122.100  # CHANGEME
          - name: internalapi
            subnetName: subnet1
          - name: storage
            subnetName: subnet1
          - name: tenant
            subnetName: subnet1

    services:
      - vfio-pci-bind
      - bootstrap
      - download-cache
      - configure-network
      - validate-network
      - install-os
      - configure-os
      - ssh-known-hosts
      - run-os
      - reboot-os
      - install-certs
      - libvirt
      - ovn
      - neutron-ovn
      - nova-custom-gpu
      - neutron-metadata
      - telemetry

  nova:
    compute:
      # Full-device passthrough does not require CPU pinning.
      # CHANGEME - adjust if your workload needs dedicated CPU cores / reserved memory.
      conf: ""
      # conf: |
      #   [DEFAULT]
      #   reserved_host_memory_mb = 4096
      #   [compute]
      #   cpu_shared_set = 0-3,24-27    # CHANGEME
      #   cpu_dedicated_set = 8-23,32-47  # CHANGEME
    migration:
      ssh_keys:
        private: CHANGEME4
        public: CHANGEME5

    pci:
      conf: |
        # NVIDIA RTX PRO 6000 Blackwell DC — full-device VFIO passthrough.
        [pci]
        report_in_placement = True
        device_spec = {"vendor_id": "10de", "product_id": "2bb5"}
        alias = {"name": "rtx-pro-6000", "vendor_id": "10de", "product_id": "2bb5", "device_type": "type-PF", "numa_policy": "preferred"}
